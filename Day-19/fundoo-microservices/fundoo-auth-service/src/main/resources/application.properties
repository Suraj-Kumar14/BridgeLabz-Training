spring.application.name=fundoo-auth-service

server.port=8081


#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Suraj@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Eureka
# ===============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=my-secret-key-for-fundoo-notes-application-123456789
jwt.expiration=86400000


# ===============================
# RabbitMQ Configuration
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Actuator
management.endpoints.web.exposure.include=health,info

