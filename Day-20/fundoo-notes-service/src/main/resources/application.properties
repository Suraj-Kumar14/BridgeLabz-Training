spring.application.name=fundoo-notes-service

server.port=8082

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=Suraj@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true


#Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.boot.admin.client.url=http://localhost:9090