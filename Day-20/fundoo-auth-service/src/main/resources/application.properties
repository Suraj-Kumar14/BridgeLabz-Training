spring.application.name=fundoo-auth-service

server.port=8081

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Suraj@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=my-secret-key-for-fundoo-notes-application-123456789
jwt.expiration=86400000


# ===============================
# RabbitMQ Configuration
# ===============================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.boot.admin.client.url=http://localhost:9090
