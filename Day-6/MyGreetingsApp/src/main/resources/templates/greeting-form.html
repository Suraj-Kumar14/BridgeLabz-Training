<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Greeting Form</title>
</head>

<body>

	<h2>Add Greeting</h2>

	<form th:action="@{/greetings}" th:object="${greeting}" method="post">

		<label>Name:</label>
		<input type="text" th:field="*{name}" required>

		<br><br>

		<label>Message:</label>
		<input type="text" th:field="*{message}" required>

		<br><br>

		<button type="submit">Save Greeting</button>

	</form>

	<br>

	<a th:href="@{/greetings}">
		Back to Greetings
	</a>

</body>

</html>
